    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800/95 backdrop-blur text-slate-100 text-xs px-4 py-3 rounded-2xl border border-slate-600/50 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[100] flex items-center gap-2.5 max-w-[90vw] whitespace-nowrap">

        <span id="toast-msg" class="font-medium">알림 메시지</span>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmJF8oDIVUkrzXayIhrzBCQwSdmozXVWo",
            authDomain: "restaurant-8c4a3.firebaseapp.com",
            databaseURL: "https://restaurant-8c4a3-default-rtdb.firebaseio.com",
            projectId: "restaurant-8c4a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const placesRef = ref(db, 'restaurants');
        const KAKAO_KEY = "f88913c579f0bc23016de619484e0156";

        let map = null;
        let leafletMap = null;
        let infoWindow = null;
        let markers = [];
        let leafletMarkers = [];
        let placesData = [];
        let customOverlays = {}; 
        let maxZIndex = 10;      
        
        let currentFilter = '전체';
        let currentRegion = '전체'; 
        let currentSort = 'rating'; 
        let userLat = null;         
        let userLng = null;         
        let clickMarker = null;
        let isFallbackMode = false;
        let toastTimeout = null;

        let userLocOverlay = null; 
        let userLocLeafletMarker = null;

        let isRecommendationMode = false; 
        let recommendedPlaceIds = [];     
        let recommendationHistory = [];   
        let externalRecommendations = []; // 핫플 추천 데이터 배열
        let kakaoRecPage = 1;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        // 지역 필터 추출 함수: 여수는 '전남'으로, 광주 관련 주소는 '광주'로 묶임
        function getRegionName(address) {
            if (!address) return '기타';
            const addr = address.trim();

            if (addr.includes('여수')) {
                return '전남';
            }

            if (addr.includes('전남광주특별시') || addr.includes('전남광주통합특별시') || addr.includes('광주광역시') || addr.includes('광주 ')) {
                return '광주';
            }
            
            if (addr.includes('광산구') || addr.includes('동구') || 
                addr.includes('서구') || addr.includes('남구') || addr.includes('북구')) {
                if (addr.includes('전남') || addr.includes('광주')) {
                    return '광주';
                }
            }

            let firstWord = addr.split(' ')[0];
            const map = {
                '서울특별시': '서울', '부산광역시': '부산', '대구광역시': '대구', 
                '인천광역시': '인천', '광주광역시': '광주', '대전광역시': '대전', 
                '울산광역시': '울산', '세종특별자치시': '세종', '제주특별자치도': '제주', 
                '강원특별자치도': '강원', '전북특별자치도': '전북', '충청북도': '충북',
                '충청남도': '충남', '경상북도': '경북', '경상남도': '경남',
                '전라북도': '전북', '전라남도': '전남', '경기도': '경기',
                '전남': '전남', '전북': '전북', '경남': '경남', '경북': '경북', 
                '충남': '충남', '충북': '충북'
            };
            return map[firstWord] || firstWord;
        }

        function updateRegionFilterOptions() {
            const select = document.getElementById('region-filter');
            if (!select) return;
            
            const regions = new Set();
            placesData.forEach(p => regions.add(getRegionName(p.address)));
            
            const sortedRegions = Array.from(regions).sort();
            const prevVal = select.value;
            
            let html = `<option value="전체">전체 지역</option>`;
            sortedRegions.forEach(r => {
                html += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
            });
            select.innerHTML = html;
            
            if (sortedRegions.includes(prevVal) || prevVal === '전체') {
                select.value = prevVal;
                currentRegion = prevVal;
            } else {
                select.value = '전체';
                currentRegion = '전체';
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = msg;
            
            if (isError) {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400 text-sm";
                toast.classList.replace('border-slate-600/50', 'border-rose-900/80');
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
                toast.classList.replace('border-rose-900/80', 'border-slate-600/50');
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');

        function initMobileDragSheet() {
            const sidebar = document.getElementById('sidebar-panel');
            const handle = document.getElementById('drag-handle');
            if (!sidebar || !handle) return;

            let startY = 0;
            let startHeight = 0;
            let isDragging = false;
            let viewportHeight = window.innerHeight;
            const MIN_HEIGHT = 64; 

            function onTouchStart(e) {
                if (window.innerWidth >= 768) return; 
                isDragging = true;
                startY = e.touches[0].clientY;
                startHeight = sidebar.getBoundingClientRect().height;
                sidebar.style.transition = 'none'; 
                viewportHeight = window.innerHeight;
            }

            function onTouchMove(e) {
                if (!isDragging || window.innerWidth >= 768) return;
                const currentY = e.touches[0].clientY;
                const deltaY = startY - currentY;
                let newHeight = startHeight + deltaY;
                const maxHeight = viewportHeight * 0.85;
                if (newHeight < MIN_HEIGHT) newHeight = MIN_HEIGHT;
                if (newHeight > maxHeight) newHeight = maxHeight;
                sidebar.style.height = `${newHeight}px`;
            }

            function onTouchEnd(e) {
                if (!isDragging || window.innerWidth >= 768) return;
                isDragging = false;
                sidebar.style.transition = 'height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                const finalHeight = sidebar.getBoundingClientRect().height;
                const threshold = viewportHeight * 0.35; 
                if (finalHeight < threshold) {
                    sidebar.style.height = `${MIN_HEIGHT}px`; 
                } else {
                    sidebar.style.height = '58%'; 
                }
                setTimeout(() => { if (map) map.relayout(); }, 310);
            }

            handle.addEventListener('touchstart', onTouchStart, {passive: true});
            window.addEventListener('touchmove', onTouchMove, {passive: true});
            window.addEventListener('touchend', onTouchEnd);
            handle.addEventListener('click', () => {
                if (window.innerWidth >= 768) return;
                sidebar.style.transition = 'height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                const currentHeight = sidebar.getBoundingClientRect().height;
                if (currentHeight <= MIN_HEIGHT + 10) {
                    sidebar.style.height = '58%'; 
                } else {
                    sidebar.style.height = `${MIN_HEIGHT}px`; 
                }
                setTimeout(() => { if (map) map.relayout(); }, 310);
            });
        }

                        placesData.push({ id: key, ...data[key] });

                }

        function initKakaoMapEngine() {
            if (window.kakao && window.kakao.maps) {
                setupKakaoMap();
                return;
            }

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;

            script.onload = () => {
                try {
                    kakao.maps.load(() => { setupKakaoMap(); });
                } catch (e) {
                    console.warn('Kakao map load failed:', e);
                    showMapErrorBanner();
                }
            };
            script.onerror = (err) => {
                console.warn('Kakao map script load error:', err);
                showMapErrorBanner();
            };
            document.head.appendChild(script);
        }

        function setupKakaoMap() {
            const container = document.getElementById('map');
            if (!container) return;

            const options = { center: new kakao.maps.LatLng(35.1524, 129.0596), level: 5 };
            map = new kakao.maps.Map(container, options);
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            setTimeout(() => {
                if (map) {
                    map.relayout();
                    map.setCenter(new kakao.maps.LatLng(35.1524, 129.0596));
                    
                    if (navigator.permissions) {
                        navigator.permissions.query({name: 'geolocation'}).then((result) => {
                            if (result.state === 'granted') panToCurrentLocation(true); 
                        });
                    }
                }
            }, 300);

            kakao.maps.event.addListener(map, 'click', (mouseEvent) => {
                const lat = mouseEvent.latLng.getLat();
                const lng = mouseEvent.latLng.getLng();

                if (clickMarker) clickMarker.setMap(null);
                clickMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(lat, lng),
                    map: map
                });

                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.coord2Address(lng, lat, (result, status) => {
                    let addressName = '선택 위치 주소';
                    if (status === kakao.maps.services.Status.OK && result[0]) {
                        addressName = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
                    }
                    
                    const isEditing = !!document.getElementById('place-id').value;
                    const formPanel = document.getElementById('form-panel');
                    const isFormOpen = !formPanel.classList.contains('hidden');

                    if (isEditing && isFormOpen) {
                        updateFormLocation(lat, lng, addressName);
                        showToast('📍 클릭한 위치로 마커가 변경되었습니다.');
                    } else {
                        openFormForAdd(lat, lng, addressName);
                    }
                });
            });

            window.addEventListener('resize', () => { if (map) map.relayout(); });
            window.addEventListener('orientationchange', () => { setTimeout(() => { if (map) map.relayout(); }, 200); });
            renderUI();
        }

        function showMapErrorBanner() {
            const banner = document.getElementById('map-error-banner');
            if (banner) banner.classList.remove('hidden');
        }

        function retryKakaoMap() {
            const banner = document.getElementById('map-error-banner');

        function useOpenStreetMapFallback() {
            if (isFallbackMode) return;
            isFallbackMode = true;

            const banner = document.getElementById('map-error-banner');
            if (banner) banner.classList.add('hidden');

            const css = document.createElement('link');

            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);

            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';

                container.innerHTML = '';

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(leafletMap);

                leafletMap.on('click', (e) => {
                    const lat = e.latlng.lat;
                    const lng = e.latlng.lng;
                    const addressName = `선택 좌표 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                        updateFormLocation(lat, lng, addressName);

        function updateFormLocation(lat, lng, address) {

        function panToCurrentLocation(isSilent = false) {
            if (!navigator.geolocation) {
                if(!isSilent) showToast('현재 브라우저에서는 위치 기능을 지원하지 않습니다.', true);
                return;
            }

            const getLoc = () => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        
                        if (userLocOverlay && userLocOverlay.setMap) userLocOverlay.setMap(null);
                        if (userLocLeafletMarker && leafletMap) leafletMap.removeLayer(userLocLeafletMarker);

                        const pointHtml = `
                            <div class="relative flex items-center justify-center w-6 h-6">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-600 border border-white shadow-md"></span>
                            </div>
                        `;

                        if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                            const currentLatLng = new kakao.maps.LatLng(lat, lng);
                            map.panTo(currentLatLng);
                            
                            userLocOverlay = new kakao.maps.CustomOverlay({
                                position: currentLatLng,
                                content: pointHtml,
                                map: map,
                                yAnchor: 0.5,
                                zIndex: 9999 
                            });
                        } else if (leafletMap) {
                            leafletMap.setView([lat, lng], 15);
                            
                            const customIcon = L.divIcon({
                                className: 'custom-div-icon',
                                html: pointHtml,
                                iconSize: [24, 24],
                                iconAnchor: [12, 12]
                            });
                            userLocLeafletMarker = L.marker([lat, lng], {icon: customIcon}).addTo(leafletMap);
                        }
                        
                        if(!isSilent) showToast('현재 내 위치로 이동했습니다.');
                    },
                    (error) => {
                        console.warn("Geolocation failed:", error);
                        if(!isSilent) {
                            if (error.code === error.PERMISSION_DENIED) {
                                showToast('위치 권한이 거부되었습니다. 기기 설정에서 권한을 허용해 주세요.', true);
                            } else {
                                showToast('위치 정보를 가져올 수 없습니다. 네트워크나 GPS 상태를 확인하세요.', true);
                            }
                        }
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            if (navigator.permissions) {
                navigator.permissions.query({name: 'geolocation'}).then((result) => {
                    if (result.state === 'denied') {
                        if(!isSilent) showToast('위치 권한이 차단되어 있습니다. 브라우저 설정에서 권한을 허용해주세요.', true);
                    } else { getLoc(); }
                });
            } else { getLoc(); }
        }

                                    ? `<div style="display:flex; gap:6px;">
                                        <a href="${naverMapUrl}" target="_blank" style="flex:1; background:#059669; color:white; padding:6px 0; border-radius:6px; text-decoration:none; font-size:11px; font-weight:bold;">📍 길찾기</a>
                                        <button onclick="saveExternalToDB('${place.id}')" style="flex:1; background:#e11d48; color:white; padding:6px 0; border-radius:6px; border:none; font-size:11px; font-weight:bold; cursor:pointer;">➕ 내 DB 저장</button>
                                       </div>`
                                    : `<div style="display:flex; gap:6px;">
                                        <a href="${naverMapUrl}" target="_blank" style="flex:1; background:#059669; color:white; padding:6px 0; border-radius:6px; text-decoration:none; font-size:11px; font-weight:bold;">📍 길찾기</a>
                                        <button onclick="openFormForEdit('${place.id}')" style="flex:1; background:#4f46e5; color:white; padding:6px 0; border-radius:6px; border:none; font-size:11px; font-weight:bold; cursor:pointer;">✏️ 수정</button>
                                       </div>`
                                }
                            </div>
                        `);
                    leafletMarkers.push(lMarker);
                }

                const itemEl = document.createElement('div');
                itemEl.className = 'p-3.5 hover:bg-slate-800/80 transition cursor-pointer flex justify-between items-start group';
                itemEl.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3" onclick="focusPlace(${lat}, ${lng}, '${place.id}')">
                        <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                            <span class="text-[9px] font-extrabold bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2 py-0.5 rounded-md shadow-sm">TOP ${index + 1}</span>
                            <span class="font-bold text-slate-100 text-[15px] group-hover:text-indigo-400 transition truncate tracking-tight">${escapeHtml(place.name)}</span>
                            <span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 rounded-md border border-slate-700/60 font-medium">${escapeHtml(place.category)}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mb-2 line-clamp-1 flex items-center gap-1"><i class="fa-solid fa-location-dot text-[10px] text-slate-500 opacity-70"></i> ${escapeHtml(place.address)}</p>
                        <div class="flex items-center gap-1.5 text-xs">
                            ${ratingDisplay}
                            ${distanceDisplay}
                            <span class="text-slate-500 text-[11px] truncate max-w-[150px] ml-2 border-l border-slate-700 pl-2 opacity-80">${escapeHtml(memoText)}</span>
                        </div>
                    </div>
                    
                    <div class="flex gap-1 md:opacity-0 group-hover:opacity-100 transition items-center bg-slate-900/80 backdrop-blur px-1 py-1 rounded-lg border border-slate-800 shadow-sm">
                        ${actionButtonsHtml}
                    </div>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        function bringToFront(id) {
            if (customOverlays[id]) {
                maxZIndex++;
                customOverlays[id].setZIndex(maxZIndex);
            }
        }

        function toggleOverlayMemo(id) {
            const memoEl = document.getElementById(`overlay-memo-${id}`);
            if (memoEl) {
                memoEl.classList.toggle('hidden');
                bringToFront(id); 
            }
        }

        function filterCategory(cat) {
            isRecommendationMode = false; 
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(cat)) {
                    btn.className = 'category-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm';
                } else {
                    btn.className = 'category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition';
                }
            });

            renderUI();
            if (cat === '전체' && currentRegion === '전체' && map && placesData.length > 0 && typeof kakao !== 'undefined' && kakao.maps) {
                const bounds = new kakao.maps.LatLngBounds();
                placesData.forEach(p => bounds.extend(new kakao.maps.LatLng(p.latitude, p.longitude)));
                if(!bounds.isEmpty()) map.setBounds(bounds);
            }
        }

        function filterRegion(val) {
            currentRegion = val;
            isRecommendationMode = false;
            renderUI();

            if (!isFallbackMode && map && typeof kakao !== 'undefined' && kakao.maps) {
                const filtered = placesData.filter(p => {
                    const matchCategory = currentFilter === '전체' || p.category === currentFilter;
                    const matchRegion = currentRegion === '전체' || getRegionName(p.address) === currentRegion;
                    return matchCategory && matchRegion;
                });
                
                if (filtered.length > 0) {
                    const bounds = new kakao.maps.LatLngBounds();
                    filtered.forEach(p => bounds.extend(new kakao.maps.LatLng(parseFloat(p.latitude), parseFloat(p.longitude))));
                    if(!bounds.isEmpty()) map.setBounds(bounds);
                } else {
                    showToast('해당 지역에는 맛집이 없습니다.');
                }
            }
        }

        function focusPlace(lat, lng, id) {
            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                const loc = new kakao.maps.LatLng(lat, lng);
                map.panTo(loc);
                
                setTimeout(() => {
                    bringToFront(id);
                    const memoEl = document.getElementById(`overlay-memo-${id}`);
                    if (memoEl) memoEl.classList.remove('hidden');
                }, 300);
            } else if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
            }
            
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar-panel');
                if (sidebar) {
                    sidebar.style.transition = 'height 0.3s ease';
                    sidebar.style.height = '40%';
                }
            }
        }

        function selectSearchResult(lat, lng, name, address) {
            lat = parseFloat(lat);
            lng = parseFloat(lng);
            document.getElementById('input-name').value = name;
            updateFormLocation(lat, lng, address);
            document.getElementById('name-search-results').classList.add('hidden');

            if (map && !isFallbackMode) {
                map.panTo(new kakao.maps.LatLng(lat, lng));
                if (clickMarker) clickMarker.setMap(null);
                clickMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map });
            } else if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
            }
            showToast(`'${name}' 위치가 지정되었습니다.`);
        }

        function searchAddress() {
            const keyword = document.getElementById('input-name').value.trim();
            const resultsContainer = document.getElementById('name-search-results');
            resultsContainer.innerHTML = '';
            
            if (!keyword) {
                showToast('검색할 상호명을 먼저 입력해 주세요.', true);
                resultsContainer.classList.add('hidden');
                return;
            }

            if (!isFallbackMode && typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                const ps = new kakao.maps.services.Places();
                const options = map ? { location: map.getCenter(), sort: kakao.maps.services.SortBy.DISTANCE } : {};

                ps.keywordSearch(keyword, (data, status) => {
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        resultsContainer.classList.remove('hidden');
                        data.forEach((place) => {
                            const lat = parseFloat(place.y);
                            const lng = parseFloat(place.x);
                            const address = place.road_address_name || place.address_name;
                            const li = document.createElement('li');
                            li.className = 'p-3 hover:bg-slate-700 cursor-pointer transition';
                            li.innerHTML = `
                                <div class="font-bold text-slate-100 flex items-center justify-between mb-0.5">
                                    <span class="truncate">${escapeHtml(place.place_name)}</span>
                                    ${place.category_name ? `<span class="text-[10px] text-indigo-300 font-normal bg-indigo-950/80 border border-indigo-800/50 px-1.5 py-0.5 rounded whitespace-nowrap ml-2">${escapeHtml(place.category_name.split(' > ').pop())}</span>` : ''}
                                </div>
                                <div class="text-[11px] text-slate-400"><i class="fa-solid fa-location-dot mr-1 text-slate-500"></i>${escapeHtml(address)}</div>
                            `;
                            li.onclick = () => selectSearchResult(lat, lng, place.place_name, address);
                            resultsContainer.appendChild(li);
                        });
                        showToast(`검색된 장소 중 하나를 선택해 주세요.`);
                    } else {
                        resultsContainer.classList.add('hidden');
                        showToast('상호명 검색 결과를 찾을 수 없습니다.', true);
                    }
                }, options);
            } else {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            resultsContainer.classList.remove('hidden');
                            data.forEach(place => {
                                const lat = parseFloat(place.lat);
                                const lng = parseFloat(place.lon);
                                const address = place.display_name;
                                const li = document.createElement('li');
                                li.className = 'p-3 hover:bg-slate-700 cursor-pointer transition';
                                li.innerHTML = `
                                    <div class="font-bold text-slate-100">${escapeHtml(keyword)} (유사 위치)</div>
                                    <div class="text-[11px] text-slate-400 mt-1 line-clamp-2">${escapeHtml(address)}</div>
                                `;
                                li.onclick = () => selectSearchResult(lat, lng, keyword, address);
                                resultsContainer.appendChild(li);
                            });
                            showToast(`검색된 장소 중 하나를 선택해 주세요.`);
                        } else {
                            resultsContainer.classList.add('hidden');
                            showToast('상호명 검색 결과를 찾지 못했습니다.', true);
                        }
                    }).catch(() => showToast('검색 중 오류가 발생했습니다.', true));
            }
        }

        function searchSpecificAddress() {
            const address = document.getElementById('input-address').value.trim();
            if (!address) { showToast('검색할 주소를 입력해 주세요.', true); return; }

            if (!isFallbackMode && typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.addressSearch(address, (data, status) => {
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        const lat = parseFloat(data[0].y);
                        const lng = parseFloat(data[0].x);
                        const addressName = data[0].road_address ? data[0].road_address.address_name : data[0].address.address_name;
                        updateFormLocation(lat, lng, addressName);
                        if (map) {
                            map.panTo(new kakao.maps.LatLng(lat, lng));
                            if (clickMarker) clickMarker.setMap(null);
                            clickMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map });
                        }
                        showToast('입력하신 주소 위치를 확인했습니다.');
                    } else {
                        const ps = new kakao.maps.services.Places();
                        ps.keywordSearch(address, (data2, status2) => {
                            if (status2 === kakao.maps.services.Status.OK && data2.length > 0) {
                                const lat2 = parseFloat(data2[0].y);
                                const lng2 = parseFloat(data2[0].x);
                                const addressName2 = data2[0].road_address_name || data2[0].address_name;
                                updateFormLocation(lat2, lng2, addressName2);
                                if (map) {
                                    map.panTo(new kakao.maps.LatLng(lat2, lng2));
                                    if (clickMarker) clickMarker.setMap(null);
                                    clickMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat2, lng2), map: map });
                                }
                                showToast('입력하신 장소 위치를 확인했습니다.');
                            } else {
                                showToast('해당 주소나 장소를 찾을 수 없습니다.', true);
                            }
                        });
                    }
                });
            } else {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const lat = parseFloat(data[0].lat);
                            const lng = parseFloat(data[0].lon);
                            updateFormLocation(lat, lng, data[0].display_name);
                            if (leafletMap) leafletMap.setView([lat, lng], 16);
                            showToast('입력하신 주소 위치가 적용되었습니다.');
                        } else {
                            showToast('주소 검색 결과를 찾지 못했습니다.', true);
                        }
                    }).catch(() => showToast('주소 검색 중 오류가 발생했습니다.', true));
            }
        }

        function openFormForAdd(lat = '', lng = '', address = '') {
            const formPanel = document.getElementById('form-panel');
            formPanel.classList.remove('hidden');
            formPanel.classList.add('translate-y-0');
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-400"></i> 새로운 맛집 등록`;
            document.getElementById('place-id').value = '';
            document.getElementById('place-form').reset();
            if (lat && lng) updateFormLocation(lat, lng, address);
        }

        function openFormForEdit(id) {
            const place = placesData.find(p => p.id === id);
            if (!place) return;
            const formPanel = document.getElementById('form-panel');
            formPanel.classList.remove('hidden');
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-400"></i> 맛집 정보 수정`;
            document.getElementById('place-id').value = place.id;
            document.getElementById('input-name').value = place.name;
            document.getElementById('input-address').value = place.address;
            document.getElementById('input-lat').value = place.latitude;
            document.getElementById('input-lng').value = place.longitude;
            document.getElementById('input-category').value = place.category;
            document.getElementById('input-rating').value = parseFloat(place.rating).toFixed(1);
            document.getElementById('input-memo').value = place.memo || '';
            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                map.panTo(new kakao.maps.LatLng(place.latitude, place.longitude));
            }
        }

        function closeForm() {
            document.getElementById('form-panel').classList.add('hidden');
            document.getElementById('name-search-results').classList.add('hidden');
            if (clickMarker && clickMarker.setMap) clickMarker.setMap(null);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('place-id').value;
            const name = document.getElementById('input-name').value.trim();
            const address = document.getElementById('input-address').value.trim();
            const lat = document.getElementById('input-lat').value;
            const lng = document.getElementById('input-lng').value;
            const category = document.getElementById('input-category').value;
            const rating = parseFloat(document.getElementById('input-rating').value);
            const memo = document.getElementById('input-memo').value.trim();

            if (!name || !address) { showToast('상호명과 주소를 모두 입력해주세요.', true); return; }

            const payload = {
                name, address,
                latitude: lat ? parseFloat(lat) : 35.1524,
                longitude: lng ? parseFloat(lng) : 129.0596,
                category, rating, memo, updatedAt: Date.now()
            };

            if (id) {
                update(ref(db, `restaurants/${id}`), payload)
                    .then(() => { showToast(`'${name}' 정보가 성공적으로 수정되었습니다.`); closeForm(); })
                    .catch((err) => { console.error(err); showToast('서버 접속 또는 권한 오류로 수정에 실패했습니다.', true); });
            } else {
                push(placesRef, payload)
                    .then(() => {
                        showToast(`'${name}' 맛집이 신규 등록되었습니다. 🎉`);
                        closeForm();
                        if(currentRegion !== '전체') {
                            document.getElementById('region-filter').value = '전체';
                            filterRegion('전체');
                        }
                    })
                    .catch((err) => { console.error(err); showToast('서버 접속 또는 권한 오류로 등록에 실패했습니다.', true); });
            }
        }

        function deletePlace(id) {
            const place = placesData.find(p => p.id === id);
            const name = place ? place.name : '해당 맛집';
            if (confirm(`'${name}' 항목을 정말로 삭제하시겠습니까?`)) {
                remove(ref(db, `restaurants/${id}`))
                    .then(() => { showToast(`'${name}' 항목이 삭제되었습니다.`); })
                    .catch((err) => { console.error(err); showToast('삭제에 실패했습니다. 관리자 권한을 확인하세요.', true); });
            }
        }

        function recommendPlaces() {
            let centerLat = null;
            let centerLng = null;

            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                const center = map.getCenter();
                centerLat = center.getLat();
                centerLng = center.getLng();
            } else if (leafletMap) {
                const center = leafletMap.getCenter();
                centerLat = center.lat;
                centerLng = center.lng;
            }

            if (centerLat === null || centerLng === null) {
                showToast('지도 위치를 확인할 수 없어 추천할 수 없습니다.', true);
                return;
            }

            userLat = centerLat;
            userLng = centerLng;

            if (isFallbackMode || typeof kakao === 'undefined' || !kakao.maps.services) {
                showToast('현재 카카오맵 API가 제한되어 외부 핫플 추천을 불러올 수 없습니다.', true);
                return;
            }

            const ps = new kakao.maps.services.Places();
            const centerPosition = new kakao.maps.LatLng(centerLat, centerLng);
            
            showToast('내 주변 인스타 핫플/맛집을 분석 중입니다... 🔎');

            ps.keywordSearch('핫플 맛집', (data, status, pagination) => {
                if (status === kakao.maps.services.Status.OK) {
                    
                    let candidates = data.filter(place => !recommendationHistory.includes(place.id));
                    
                    if (candidates.length < 5 && kakaoRecPage < 3) {
                        kakaoRecPage++;
                        recommendPlaces(); 
                        return;
                    }

                    if (candidates.length === 0) {
                        recommendationHistory = [];
                        kakaoRecPage = 1;
                        candidates = data;
                        showToast('주변 핫플을 모두 확인하셨습니다! 새롭게 사이클을 돌립니다. 🔄');
                    } else {
                        showToast('요즘 가장 핫한 주변 식당 5곳을 추천합니다! 💖');
                    }

                    const top5 = candidates.slice(0, 5);
                    top5.forEach(p => recommendationHistory.push(p.id)); 

                    externalRecommendations = top5.map(place => {
                        let cat = '기타';
                        if (place.category_name.includes('카페')) cat = '카페';
                        else if (place.category_name.includes('한식')) cat = '한식';
                        else if (place.category_name.includes('양식')) cat = '양식';
                        else if (place.category_name.includes('일식')) cat = '일식';
                        else if (place.category_name.includes('중식')) cat = '중식';

                        return {
                            id: place.id,
                            name: place.place_name,
                            address: place.road_address_name || place.address_name,
                            latitude: place.y,
                            longitude: place.x,
                            category: cat,
                            rating: '0', 
                            isExternal: true
                        };
                    });

                    isRecommendationMode = true;
                    
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.className = 'category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition';
                    });
                    document.getElementById('region-filter').value = '전체';
                    currentRegion = '전체';

                    renderUI();

                    const bounds = new kakao.maps.LatLngBounds();
                    externalRecommendations.forEach(p => bounds.extend(new kakao.maps.LatLng(parseFloat(p.latitude), parseFloat(p.longitude))));
                    if(!bounds.isEmpty()) map.setBounds(bounds);

                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    showToast('주변에 핫플 검색 결과가 없습니다. 지도를 조금 이동해보세요.', true);
                } else {
                    showToast('추천 검색 중 오류가 발생했습니다.', true);
                }
            }, { 
                location: centerPosition, 
                radius: 10000, 
                sort: kakao.maps.services.SortBy.ACCURACY,
                size: 15,
                page: kakaoRecPage
            });
        }

        function saveExternalToDB(id) {
            const place = externalRecommendations.find(p => p.id === id);
            if (!place) return;
            
            openFormForAdd(place.latitude, place.longitude, place.address);
            
            document.getElementById('input-name').value = place.name;
            document.getElementById('input-category').value = place.category;
            document.getElementById('input-memo').value = '인스타그램 핫플 추천 맛집입니다! 🔥';
            
            showToast(`'${place.name}' 등록 준비! 평점과 메모를 수정한 후 저장하세요.`);
        }

        Object.assign(window, {
            panToCurrentLocation, toggleSortMode, filterCategory, filterRegion,
            openFormForAdd, openFormForEdit, closeForm, handleFormSubmit,
            deletePlace, searchAddress, searchSpecificAddress, retryKakaoMap,
            useOpenStreetMapFallback, focusPlace, recommendPlaces,
            toggleOverlayMemo, bringToFront, saveExternalToDB
        });
    </script>
</body>
</html>

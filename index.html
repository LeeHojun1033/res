<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>맛집 저장소</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @supports (padding: env(safe-area-inset-bottom)) {
            .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 font-sans h-[100dvh] flex flex-col md:flex-row overflow-hidden select-none text-slate-100">

    <!-- 모바일 전용 뷰 전환 플로팅 탭 -->
    <div class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 backdrop-blur-xl text-white px-2 py-1.5 rounded-full shadow-2xl flex items-center border border-slate-700/60 safe-bottom">
        <button id="tab-map-btn" onclick="switchTab('map')" class="px-5 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-md">
            <i class="fa-solid fa-map-location-dot"></i> 지도
        </button>
        <button id="tab-list-btn" onclick="switchTab('list')" class="px-5 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 text-slate-300 hover:text-white">
            <i class="fa-solid fa-list-ul"></i> 목록
        </button>
    </div>

    <!-- 사이드바 패널 (목록 및 입력 폼) -->
    <div id="sidebar-panel" class="w-full md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col h-full z-10 shadow-2xl hidden md:flex">
        <!-- 헤더 영역 -->
        <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between shadow-sm">
            <h1 class="text-lg font-bold flex items-center gap-2.5 text-indigo-400">
                <i class="fa-solid fa-utensils"></i> 맛집 저장소
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="panToCurrentLocation()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1.5 rounded-xl border border-slate-700 transition flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-location-crosshairs text-indigo-400"></i> 현위치
                </button>
                <button onclick="resetForm()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-xl transition font-semibold shadow-lg shadow-indigo-600/30 flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> 등록
                </button>
            </div>
        </div>

        <!-- 통합 가게이름/주소 검색창 영역 -->
        <div class="p-3 bg-slate-950/60 border-b border-slate-800/80">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-xs"></i>
                <input type="text" id="search-keyword" onkeyup="handleSearchKeyup(event)" placeholder="가게이름, 주소, 장소 검색..." class="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-8 pr-16 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                <button onclick="executeSearch()" class="absolute right-1 top-1/2 -translate-y-1/2 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] px-2.5 py-1.5 rounded-lg transition font-medium">
                    검색
                </button>
            </div>
            <!-- 검색 상태 안내 바 -->
            <div id="search-status-bar" class="hidden mt-2 flex items-center justify-between text-[11px] text-slate-400 px-1">
                <span id="search-status-text">검색 결과: 0건</span>
                <button onclick="clearSearch()" class="text-indigo-400 hover:underline">초기화</button>
            </div>
        </div>

        <!-- 카테고리 필터 영역 -->
        <div class="p-3 border-b border-slate-800/80 bg-slate-950/50 flex gap-1.5 overflow-x-auto text-xs scrollbar-none">
            <button onclick="filterCategory('전체')" class="category-btn active bg-indigo-600 text-white px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm">전체</button>
            <button onclick="filterCategory('한식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">한식</button>
            <button onclick="filterCategory('중식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">중식</button>
            <button onclick="filterCategory('일식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">일식</button>
            <button onclick="filterCategory('양식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">양식</button>
            <button onclick="filterCategory('카페')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">카페</button>
            <button onclick="filterCategory('기타')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">기타</button>
        </div>

        <!-- 맛집 리스트 용기 -->
        <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/60 bg-slate-900">
            <!-- Dynamic JS Items Insertion -->
        </div>

        <!-- 신규/수정 입력 폼 (사이드바 하단 고정) -->
        <div id="form-container" class="p-4 border-t border-slate-800 bg-slate-950/95 backdrop-blur-lg shadow-2xl hidden max-h-[60vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h2 id="form-title" class="font-bold text-slate-100 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square text-indigo-400"></i> 신규 맛집 등록
                </h2>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-200 text-xs p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <form id="place-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="place-id">
                
                <div>
                    <label class="block font-medium text-slate-300 mb-1">식당 이름 *</label>
                    <input type="text" id="input-name" required placeholder="예: 광화문 국밥" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-slate-100 placeholder-slate-500 text-base md:text-xs focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1">위치 정보 *</label>
                    <div class="flex gap-1.5 mb-1.5">
                        <input type="text" id="input-address" required readonly placeholder="지도를 클릭하거나 주소 검색" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-3 py-2 text-slate-300 text-base md:text-xs focus:outline-none">
                        <button type="button" onclick="searchAddress()" class="bg-slate-800 text-slate-200 px-3 py-2 rounded-xl border border-slate-700 hover:bg-slate-700 transition font-medium whitespace-nowrap">검색</button>
                        <button type="button" onclick="getFormCurrentLocation()" class="bg-indigo-950 text-indigo-300 px-3 py-2 rounded-xl border border-indigo-800/80 hover:bg-indigo-900 transition font-medium whitespace-nowrap">현위치</button>
                    </div>
                    <div class="flex gap-3 text-[10px] text-slate-400 px-1">
                        <span>위도: <span id="display-lat" class="text-slate-300">-</span></span>
                        <span>경도: <span id="display-lng" class="text-slate-300">-</span></span>
                    </div>
                    <input type="hidden" id="input-lat">
                    <input type="hidden" id="input-lng">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">카테고리 *</label>
                        <select id="input-category" required class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-2.5 py-2 text-slate-100 text-base md:text-xs focus:outline-none focus:border-indigo-500">
                            <option value="한식">한식</option>
                            <option value="중식">중식</option>
                            <option value="일식">일식</option>
                            <option value="양식">양식</option>
                            <option value="카페">카페</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">평점 *</label>
                        <select id="input-rating" required class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-2.5 py-2 text-slate-100 text-base md:text-xs focus:outline-none focus:border-indigo-500">
                            <option value="5.0">⭐⭐⭐⭐⭐ (5.0)</option>
                            <option value="4.5">⭐⭐⭐⭐½ (4.5)</option>
                            <option value="4.0">⭐⭐⭐⭐ (4.0)</option>
                            <option value="3.5">⭐⭐⭐½ (3.5)</option>
                            <option value="3.0">⭐⭐⭐ (3.0)</option>
                            <option value="2.5">⭐⭐½ (2.5)</option>
                            <option value="2.0">⭐⭐ (2.0)</option>
                            <option value="1.5">⭐½ (1.5)</option>
                            <option value="1.0">⭐ (1.0)</option>
                            <option value="0.5">½ (0.5)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1">메모 / 리뷰</label>
                    <textarea id="input-memo" rows="2" placeholder="추천 메뉴, 분위기, 메모를 남겨주세요." class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-slate-100 placeholder-slate-500 text-base md:text-xs focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-xl transition shadow-lg shadow-indigo-600/30">실시간 저장</button>
                    <button type="button" onclick="closeForm()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2 rounded-xl transition">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 지도 메인 영역 -->
    <div id="map-panel" class="flex-1 h-full relative flex">
        <div id="map" class="w-full h-full"></div>

        <!-- 지도 위 플로팅 현위치 버튼 -->
        <button onclick="panToCurrentLocation()" title="현재 위치로 이동" class="absolute bottom-20 md:bottom-6 right-5 z-20 bg-slate-900/90 text-indigo-400 hover:text-white p-3 rounded-full shadow-2xl border border-slate-700/80 backdrop-blur-md transition hover:scale-105 active:scale-95">
            <i class="fa-solid fa-location-crosshairs text-lg"></i>
        </button>

        <!-- 지도 안내 배지 -->
        <div class="hidden sm:flex absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md border border-slate-700/80 px-3.5 py-2 rounded-2xl shadow-xl text-xs text-slate-300 items-center gap-2">
            <i class="fa-solid fa-circle-info text-indigo-400 text-sm"></i>
            <span>지도를 클릭하면 해당 위치에 맛집을 신규 등록할 수 있습니다.</span>
        </div>

        <!-- 카카오 지도 미인증 / 체험 모드 안내 레이어 -->
        <div id="api-key-guide" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl">
                <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <h3 class="text-base font-bold text-white mb-2">지도 서비스 안내</h3>
                <p id="api-error-msg" class="text-xs text-slate-400 mb-4 leading-relaxed">
                    카카오 지도 인증에 실패했거나 키가 등록되지 않았습니다.
                </p>
                
                <div class="space-y-2 mb-4 text-left">
                    <input type="text" id="manual-client-id" placeholder="카카오 JavaScript Key 직접 입력" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="saveManualApiKey()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-xl text-xs transition">
                        카카오 키 저장 및 다시 시도
                    </button>
                </div>

                <div class="border-t border-slate-800 pt-3">
                    <button onclick="enableFallbackMap()" class="w-full bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 font-semibold py-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-globe"></i> 체험용 무료 지도(OpenStreetMap)로 시작
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-xs w-full shadow-2xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-2"></i>
            <h3 class="text-sm font-bold text-slate-100 mb-1">삭제 확인</h3>
            <p id="confirm-text" class="text-xs text-slate-400 mb-4">정말 맛집을 삭제하시겠습니까?</p>
            <div class="flex gap-2">
                <button id="confirm-yes-btn" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold py-2 rounded-xl transition">삭제</button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium py-2 rounded-xl transition">취소</button>
            </div>
        </div>
    </div>

    <!-- 커스텀 토스트 알림 팝업 -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-[-20px]">
        <div id="toast-message" class="bg-slate-900/95 text-slate-100 text-xs px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 border border-slate-700/80 backdrop-blur-md">
            <i id="toast-icon" class="fa-solid fa-circle-check text-indigo-400 text-sm"></i>
            <span id="toast-text" class="font-medium">알림 메세지</span>
        </div>
    </div>

    <!-- 스크립트 영역 (Firebase v10 Realtime Database 연동) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getDatabase, ref, push, set, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

        // Firebase 설정 정보
        const firebaseConfig = {
            apiKey: "AIzaSyBmJF8oDIVUkrzXayIhrzBCQwSdmozXVWo",
            authDomain: "restaurant-8c4a3.firebaseapp.com",
            databaseURL: "https://restaurant-8c4a3-default-rtdb.firebaseio.com",
            projectId: "restaurant-8c4a3"
        };

        // Firebase 앱 및 Realtime Database 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const restaurantsRef = ref(db, 'restaurants');

        let map = null;
        let markers = [];
        let infoWindow = null;
        let geocoder = null;
        let placesData = [];
        let currentFilter = '전체';
        let searchQuery = '';
        let clickMarker = null;
        let myLocationMarker = null;
        let isFallbackMode = false;
        let leafletMap = null;

        function getApiUrl(path) {
            if (window.location.protocol === 'blob:' || window.location.protocol === 'file:') {
                return `http://localhost:3000${path}`;
            }
            return path;
        }

        function handleSearchKeyup(e) {
            searchQuery = e.target.value.trim();
            if (e.key === 'Enter') {
                executeSearch();
            } else {
                renderUI();
            }
        }

        function executeSearch() {
            const keyword = document.getElementById('search-keyword').value.trim();
            searchQuery = keyword;

            if (!keyword) {
                clearSearch();
                return;
            }

            // 저장된 맛집 필터링 렌더링
            const savedMatches = placesData.filter(p => 
                p.name.toLowerCase().includes(keyword.toLowerCase()) ||
                p.address.toLowerCase().includes(keyword.toLowerCase()) ||
                (p.memo && p.memo.toLowerCase().includes(keyword.toLowerCase()))
            );

            renderUI();

            // 지도 상 외부 가게이름/장소 키워드 검색 수행
            searchExternalStore(keyword, savedMatches.length);
        }

        function clearSearch() {
            searchQuery = '';
            document.getElementById('search-keyword').value = '';
            document.getElementById('search-status-bar').classList.add('hidden');
            renderUI();
        }

        function searchExternalStore(keyword, savedMatchCount) {
            if (typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                const ps = new kakao.maps.services.Places();
                ps.keywordSearch(keyword, (data, status) => {
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        const item = data[0]; // 가장 연관성이 높은 장소
                        const lat = parseFloat(item.y);
                        const lng = parseFloat(item.x);
                        const addressName = item.road_address_name || item.address_name;
                        const placeName = item.place_name;

                        if (map) map.panTo(new kakao.maps.LatLng(lat, lng));

                        if (clickMarker) clickMarker.setMap(null);
                        clickMarker = new kakao.maps.Marker({
                            position: new kakao.maps.LatLng(lat, lng),
                            map: map
                        });

                        showToast(`'${placeName}' 장소를 찾았습니다.`);

                        // 저장된 목록에 없을 경우 신규 등록 폼 자동 채움
                        if (savedMatchCount === 0) {
                            openFormForAdd(lat, lng, addressName);
                            document.getElementById('input-name').value = placeName;
                            if (item.category_name) {
                                const cat = item.category_name;
                                if (cat.includes('한식')) document.getElementById('input-category').value = '한식';
                                else if (cat.includes('중식')) document.getElementById('input-category').value = '중식';
                                else if (cat.includes('일식')) document.getElementById('input-category').value = '일식';
                                else if (cat.includes('양식')) document.getElementById('input-category').value = '양식';
                                else if (cat.includes('카페') || cat.includes('커피')) document.getElementById('input-category').value = '카페';
                            }
                        }
                    } else if (savedMatchCount === 0) {
                        showToast('검색어와 일치하는 위치 정보를 찾지 못했습니다.');
                    }
                });
            } else {
                searchWithNominatim(keyword);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadKakaoMapScript();
            listenRealtimePlaces();
        });

        // Firebase Realtime Database 실시간 데이터 동기화 (onValue)
        function listenRealtimePlaces() {
            onValue(restaurantsRef, (snapshot) => {
                const data = snapshot.val();
                placesData = [];
                if (data) {
                    Object.keys(data).forEach((key) => {
                        placesData.push({
                            id: key,
                            ...data[key]
                        });
                    });
                }
                renderUI();
            }, (error) => {
                console.error("Firebase Realtime 읽기 실패:", error);
                showToast("실시간 데이터를 불러오는 중 오류가 발생했습니다.");
            });
        }

        async function loadKakaoMapScript() {
            let apiKey = '';
            
            try {
                const res = await fetch(getApiUrl('/api/config'));
                const config = await res.json();
                if (config.javascriptKey && config.javascriptKey !== 'YOUR_KEY') {
                    apiKey = config.javascriptKey;
                }
            } catch (e) {
                console.warn('백엔드 API Config 수신 실패, 수동 설정 키를 확인합니다.');
            }

            if (!apiKey) {
                apiKey = localStorage.getItem('KAKAO_JAVASCRIPT_KEY') || 'f88913c579f0bc23016de619484e0156';
            }

            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${apiKey}&libraries=services&autoload=false`;
                script.onload = () => {
                    try {
                        kakao.maps.load(() => {
                            initMap();
                            resolve();
                        });
                    } catch (err) {
                        showMapApiKeyGuide('카카오 지도 인증에 실패했습니다.');
                        resolve();
                    }
                };
                script.onerror = () => {
                    showMapApiKeyGuide('카카오 지도 스크립트를 불러올 수 없습니다.');
                    resolve();
                };
                document.head.appendChild(script);
            });
        }

        function enableFallbackMap() {
            isFallbackMode = true;
            document.getElementById('api-key-guide').classList.add('hidden');
            
            if (!document.getElementById('leaflet-css')) {
                const css = document.createElement('link');
                css.id = 'leaflet-css';
                css.rel = 'stylesheet';
                css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(css);

                const js = document.createElement('script');
                js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                js.onload = () => {
                    initLeafletMap();
                    renderUI();
                };
                document.head.appendChild(js);
            } else {
                initLeafletMap();
                renderUI();
            }
            showToast('체험용 무료 지도로 전환되었습니다.');
        }

        function initLeafletMap() {
            const container = document.getElementById('map');
            container.innerHTML = '';
            
            leafletMap = L.map('map').setView([37.5665, 126.9780], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(leafletMap);

            leafletMap.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                openFormForAdd(lat, lng, `선택 좌표 (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
            });
        }

        function initMap() {
            if (isFallbackMode) return;
            const container = document.getElementById('map');
            const defaultCenter = new kakao.maps.LatLng(37.5665, 126.9780);
            const options = {
                center: defaultCenter,
                level: 3
            };

            try {
                map = new kakao.maps.Map(container, options);
                infoWindow = new kakao.maps.InfoWindow({ zIndex: 1, removable: true });
                geocoder = new kakao.maps.services.Geocoder();

                kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                    const latLng = mouseEvent.latLng;
                    const lat = latLng.getLat();
                    const lng = latLng.getLng();

                    if (clickMarker) clickMarker.setMap(null);
                    
                    clickMarker = new kakao.maps.Marker({
                        position: latLng,
                        map: map
                    });

                    if (geocoder) {
                        geocoder.coord2Address(lng, lat, function(result, status) {
                            let addressName = '선택한 위치 주소';
                            if (status === kakao.maps.services.Status.OK) {
                                if (result[0].road_address) {
                                    addressName = result[0].road_address.address_name;
                                } else if (result[0].address) {
                                    addressName = result[0].address.address_name;
                                }
                            }
                            openFormForAdd(lat, lng, addressName);
                        });
                    } else {
                        openFormForAdd(lat, lng, '선택한 좌표');
                    }
                });

                panToCurrentLocation(false);
            } catch (err) {
                showMapApiKeyGuide('카카오 지도 인증에 실패했습니다.');
            }
        }

        function panToCurrentLocation(showNotice = true) {
            if (window.innerWidth < 768) {
                switchTab('map');
            }

            if (!navigator.geolocation) {
                if (showNotice) showToast('이 브라우저에서는 위치 서비스를 지원하지 않습니다.');
                return;
            }

            if (showNotice) showToast('현재 위치 측정 중...');

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    if (map && typeof kakao !== 'undefined' && kakao.maps) {
                        const posObj = new kakao.maps.LatLng(lat, lng);
                        map.panTo(posObj);

                        if (myLocationMarker) myLocationMarker.setMap(null);
                        myLocationMarker = new kakao.maps.Marker({
                            position: posObj,
                            map: map
                        });

                        if (showNotice) showToast('현재 위치로 이동했습니다.');
                    } else if (leafletMap) {
                        leafletMap.setView([lat, lng], 16);
                        if (showNotice) showToast('현재 위치로 이동했습니다.');
                    }
                },
                (err) => {
                    if (showNotice) showToast('위치 정보를 가져올 수 없습니다.');
                }
            );
        }

        function getFormCurrentLocation() {
            if (!navigator.geolocation) {
                showToast('위치 서비스를 사용할 수 없습니다.');
                return;
            }

            showToast('현재 위치 정보를 조회합니다...');
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;

                if (geocoder && typeof kakao !== 'undefined' && kakao.maps) {
                    geocoder.coord2Address(lng, lat, (result, status) => {
                        let addressName = '현재 위치 주소';
                        if (status === kakao.maps.services.Status.OK) {
                            if (result[0].road_address) addressName = result[0].road_address.address_name;
                            else if (result[0].address) addressName = result[0].address.address_name;
                        }

                        document.getElementById('input-address').value = addressName;
                        document.getElementById('input-lat').value = lat;
                        document.getElementById('input-lng').value = lng;
                        document.getElementById('display-lat').innerText = lat.toFixed(5);
                        document.getElementById('display-lng').innerText = lng.toFixed(5);

                        if (map) map.panTo(new kakao.maps.LatLng(lat, lng));
                        showToast('현위치 주소가 입력되었습니다.');
                    });
                } else {
                    document.getElementById('input-address').value = `현위치 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                    document.getElementById('input-lat').value = lat;
                    document.getElementById('input-lng').value = lng;
                    document.getElementById('display-lat').innerText = lat.toFixed(5);
                    document.getElementById('display-lng').innerText = lng.toFixed(5);
                    showToast('현위치 좌표가 설정되었습니다.');
                }
            });
        }

        function renderUI() {
            let filteredPlaces = currentFilter === '전체' 
                ? placesData 
                : placesData.filter(p => p.category === currentFilter);

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filteredPlaces = filteredPlaces.filter(p => 
                    p.name.toLowerCase().includes(q) ||
                    p.address.toLowerCase().includes(q) ||
                    (p.memo && p.memo.toLowerCase().includes(q))
                );

                const statusBar = document.getElementById('search-status-bar');
                const statusText = document.getElementById('search-status-text');
                if (statusBar && statusText) {
                    statusBar.classList.remove('hidden');
                    statusText.innerText = `'${searchQuery}' 검색 결과: ${filteredPlaces.length}건`;
                }
            } else {
                const statusBar = document.getElementById('search-status-bar');
                if (statusBar) statusBar.classList.add('hidden');
            }

            markers.forEach(m => {
                if (m.setMap) m.setMap(null);
                else if (m.remove) m.remove();
            });
            markers = [];

            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';

            if (filteredPlaces.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-10 text-center text-slate-500 text-xs">
                        <i class="fa-solid fa-store-slash text-3xl mb-2.5 text-slate-600"></i>
                        <p class="font-medium">등록된 맛집이 없습니다.</p>
                    </div>
                `;
                return;
            }

            filteredPlaces.forEach(place => {
                const numericRating = parseFloat(place.rating) || 0;

                if (map && typeof kakao !== 'undefined' && kakao.maps && !isFallbackMode) {
                    const pos = new kakao.maps.LatLng(place.latitude, place.longitude);

                    const marker = new kakao.maps.Marker({
                        position: pos,
                        map: map,
                        title: place.name
                    });

                    kakao.maps.event.addListener(marker, 'click', () => {
                        showInfoWindow(place, marker);
                    });

                    markers.push(marker);
                } else if (leafletMap) {
                    const lMarker = L.marker([place.latitude, place.longitude]).addTo(leafletMap);
                    lMarker.bindPopup(`<b>${escapeHtml(place.name)}</b><br>⭐ ${numericRating.toFixed(1)}`);
                    markers.push(lMarker);
                }

                const itemEl = document.createElement('div');
                itemEl.className = 'p-3.5 hover:bg-slate-800/60 transition cursor-pointer flex justify-between items-start group border-b border-slate-800/60';
                itemEl.innerHTML = `
                    <div class="flex-1 pr-2" onclick="focusPlace(${place.latitude}, ${place.longitude}, '${place.id}')">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-slate-100 text-sm group-hover:text-indigo-400 transition tracking-tight">${escapeHtml(place.name)}</span>
                            <span class="text-[10px] px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded-md font-semibold border border-indigo-800/50">${escapeHtml(place.category)}</span>
                        </div>
                        <p class="text-xs text-slate-400 mb-1.5 line-clamp-1">${escapeHtml(place.address)}</p>
                        <div class="flex items-center gap-3 text-xs">
                            <span class="text-amber-400 font-bold">⭐ ${numericRating.toFixed(1)}</span>
                            <a href="https://map.kakao.com/link/map/${encodeURIComponent(place.name)},${place.latitude},${place.longitude}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] text-slate-500 hover:text-indigo-400 font-semibold flex items-center gap-1 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> 지도
                            </a>
                        </div>
                    </div>
                    <div class="flex gap-1 opacity-70 group-hover:opacity-100 transition">
                        <button onclick="openFormForEdit('${place.id}')" class="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg text-xs transition">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deletePlace('${place.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-950/40 rounded-lg text-xs transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        function showInfoWindow(place, marker) {
            const numericRating = parseFloat(place.rating) || 0;
            const kakaoUrl = `https://map.kakao.com/link/map/${encodeURIComponent(place.name)},${place.latitude},${place.longitude}`;
            const content = `
                <div style="padding:12px; min-width:200px; font-size:12px; font-family:sans-serif; line-height:1.5;">
                    <div style="color:#6366f1; font-weight:700; font-size:10px; text-transform:uppercase;">${escapeHtml(place.category)}</div>
                    <h3 style="font-weight:700; color:#0f172a; margin:2px 0 4px 0; font-size:14px;">${escapeHtml(place.name)}</h3>
                    <p style="color:#64748b; margin-bottom:6px; font-size:11px;">${escapeHtml(place.address)}</p>
                    <div style="color:#f59e0b; font-weight:700; margin-bottom:8px;">⭐ ${numericRating.toFixed(1)} / 5.0</div>
                    ${place.memo ? `<div style="background:#f8fafc; padding:6px 8px; border-radius:6px; color:#334155; font-size:11px; margin-bottom:8px; border:1px solid #e2e8f0;">${escapeHtml(place.memo)}</div>` : ''}
                    <a href="${kakaoUrl}" target="_blank" style="display:inline-block; background:#0f172a; color:#ffffff; font-weight:600; font-size:11px; padding:5px 10px; border-radius:6px; text-decoration:none;">
                        카카오맵 이동 ↗
                    </a>
                </div>
            `;
            if (infoWindow) {
                infoWindow.setContent(content);
                infoWindow.open(map, marker);
            }
        }

        function focusPlace(lat, lng, id) {
            if (window.innerWidth < 768) {
                switchTab('map');
            }

            if (map && typeof kakao !== 'undefined' && kakao.maps && !isFallbackMode) {
                const pos = new kakao.maps.LatLng(lat, lng);
                map.panTo(pos);
            } else if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
            }

            const place = placesData.find(p => p.id === id);
            const filtered = placesData.filter(p => currentFilter === '전체' || p.category === currentFilter);
            const markerIndex = filtered.findIndex(p => p.id === id);

            if (place && markers[markerIndex] && map) {
                showInfoWindow(place, markers[markerIndex]);
            }
        }

        // 폼 제출 (Firebase Realtime Database 저장)
        async function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById('place-id').value;
            const payload = {
                name: document.getElementById('input-name').value,
                address: document.getElementById('input-address').value,
                latitude: parseFloat(document.getElementById('input-lat').value),
                longitude: parseFloat(document.getElementById('input-lng').value),
                category: document.getElementById('input-category').value,
                rating: parseFloat(document.getElementById('input-rating').value),
                memo: document.getElementById('input-memo').value,
                updated_at: new Date().toISOString()
            };

            if (isNaN(payload.latitude) || isNaN(payload.longitude)) {
                showToast('지도를 클릭하거나 위치를 설정해 주세요.');
                return;
            }

            try {
                if (id) {
                    const placeRef = ref(db, `restaurants/${id}`);
                    await update(placeRef, payload);
                    showToast('맛집 정보가 수정되었습니다.');
                } else {
                    payload.created_at = new Date().toISOString();
                    const newPlaceRef = push(restaurantsRef);
                    await set(newPlaceRef, payload);
                    showToast('새 맛집이 실시간 등록되었습니다!');
                }
                closeForm();
            } catch (err) {
                console.error("Firebase 저장 에러:", err);
                showToast('저장 중 오류가 발생했습니다.');
            }
        }

        function deletePlace(id) {
            openConfirmModal('이 맛집을 삭제하시겠습니까?', async () => {
                try {
                    const placeRef = ref(db, `restaurants/${id}`);
                    await remove(placeRef);
                    showToast('삭제되었습니다.');
                    if (infoWindow) infoWindow.close();
                } catch (err) {
                    console.error("Firebase 삭제 에러:", err);
                    showToast('삭제 실패했습니다.');
                }
            });
        }

            document.getElementById('form-container').classList.remove('hidden');
            document.getElementById('form-title').innerText = '맛집 정보 수정';

        function switchTab(tab) {
            const mapPanel = document.getElementById('map-panel');
            const sidebarPanel = document.getElementById('sidebar-panel');
            const mapBtn = document.getElementById('tab-map-btn');
            const listBtn = document.getElementById('tab-list-btn');

            if (tab === 'map') {
                mapPanel.classList.remove('hidden');
                mapPanel.classList.add('flex');
                sidebarPanel.classList.add('hidden');

                mapBtn.className = 'px-5 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-md';
                listBtn.className = 'px-5 py-2 rounded-full text-xs font-semibold transition flex items-center gap-2 text-slate-300 hover:text-white';

        async function searchAddress() {
            const inputNameVal = document.getElementById('input-name').value.trim();
            const keyword = prompt('검색할 가게이름 또는 주소를 입력하세요:', inputNameVal);
            if (!keyword || !keyword.trim()) return;

            const executePlaceSearch = (centerLatLng) => {
                if (geocoder && typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                    const ps = new kakao.maps.services.Places();
                    const options = {};
                    
                    // 현재 위치 좌표가 있는 경우 거리순(DISTANCE) 정렬 옵션 지정
                    if (centerLatLng) {
                        options.location = centerLatLng;
                        options.sort = kakao.maps.services.SortBy.DISTANCE;
                    }

                    ps.keywordSearch(keyword.trim(), (data, status) => {
                        if (status === kakao.maps.services.Status.OK && data.length > 0) {
                            // 거리순 정렬 시 data[0]이 현재 위치에서 가장 가까운 장소
                            const item = data[0]; 
                            const lat = parseFloat(item.y);
                            const lng = parseFloat(item.x);
                            const addressName = item.road_address_name || item.address_name || item.place_name;

                            document.getElementById('input-name').value = item.place_name;
                            document.getElementById('input-address').value = addressName;
                            document.getElementById('input-lat').value = lat;
                            document.getElementById('input-lng').value = lng;
                            document.getElementById('display-lat').innerText = lat.toFixed(5);
                            document.getElementById('display-lng').innerText = lng.toFixed(5);

                            // 카테고리 자동 맞춤
                            if (item.category_name) {
                                const cat = item.category_name;
                                if (cat.includes('한식')) document.getElementById('input-category').value = '한식';
                                else if (cat.includes('중식')) document.getElementById('input-category').value = '중식';
                                else if (cat.includes('일식')) document.getElementById('input-category').value = '일식';
                                else if (cat.includes('양식')) document.getElementById('input-category').value = '양식';
                                else if (cat.includes('카페') || cat.includes('커피')) document.getElementById('input-category').value = '카페';
                            }

                            if (map) map.panTo(new kakao.maps.LatLng(lat, lng));

                            // 거리 정보 안내 문구 생성
                            let distText = '';
                            if (item.distance) {
                                const meters = parseInt(item.distance);
                                distText = meters >= 1000 ? ` (약 ${(meters/1000).toFixed(1)}km)` : ` (약 ${meters}m)`;
                            }

                            showToast(`현재 위치 기준 가장 가까운 '${item.place_name}'${distText} 정보를 가져왔습니다.`);
                        } else {
                            // 지번 및 도로명 주소 검색 차선책
                            geocoder.addressSearch(keyword.trim(), (result, status) => {
                                if (status === kakao.maps.services.Status.OK && result.length > 0) {
                                    const item = result[0];
                                    const lat = parseFloat(item.y);
                                    const lng = parseFloat(item.x);
                                    const addressName = item.road_address ? item.road_address.address_name : item.address_name;

                                    document.getElementById('input-address').value = addressName;
                                    document.getElementById('input-lat').value = lat;
                                    document.getElementById('input-lng').value = lng;
                                    document.getElementById('display-lat').innerText = lat.toFixed(5);
                                    document.getElementById('display-lng').innerText = lng.toFixed(5);

                                    if (map) map.panTo(new kakao.maps.LatLng(lat, lng));
                                    showToast('주소를 찾았습니다.');
                                } else {
                                    searchWithNominatim(keyword);
                                }
                            });
                        }
                    }, options);
                } else {
                    searchWithNominatim(keyword);
                }
            };

            // 사용자 GPS 위치 탐색 후 가장 가까운 지점 기준 검색 실행
            if (navigator.geolocation) {
                showToast('현재 위치에서 가장 가까운 장소를 찾는 중...');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const userPos = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                        executePlaceSearch(userPos);
                    },
                    () => {
                        // GPS 권한 거부/실패 시 현재 화면의 지도 중심점 활용
                        const mapCenter = map ? map.getCenter() : null;
                        executePlaceSearch(mapCenter);
                    },
                    { timeout: 3000 }
                );
            } else {
                const mapCenter = map ? map.getCenter() : null;
                executePlaceSearch(mapCenter);
            }
        }

        async function searchWithNominatim(keyword) {
            try {
                showToast('주소를 검색 중입니다...');
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const item = data[0];
                    const lat = parseFloat(item.lat);
                    const lng = parseFloat(item.lon);
                    const addressName = item.display_name;

                    document.getElementById('input-address').value = addressName;
                    document.getElementById('input-lat').value = lat;
                    document.getElementById('input-lng').value = lng;
                    document.getElementById('display-lat').innerText = lat.toFixed(5);
                    document.getElementById('display-lng').innerText = lng.toFixed(5);

                    if (leafletMap) {
                        leafletMap.setView([lat, lng], 16);
                    } else if (map && typeof kakao !== 'undefined' && kakao.maps) {
                        map.panTo(new kakao.maps.LatLng(lat, lng));
                    }
                    showToast('검색 결과를 적용했습니다.');
                } else {
                    showToast('검색 결과를 찾을 수 없습니다.');
                }
            } catch (e) {
                console.error(e);
                showToast('주소 검색 중 오류가 발생했습니다.');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Window 전역 이벤트 바인딩
        window.handleFormSubmit = handleFormSubmit;
        window.deletePlace = deletePlace;
        window.openFormForAdd = openFormForAdd;
        window.openFormForEdit = openFormForEdit;
        window.closeForm = closeForm;
        window.resetForm = resetForm;
        window.filterCategory = filterCategory;
        window.switchTab = switchTab;
        window.panToCurrentLocation = panToCurrentLocation;
        window.getFormCurrentLocation = getFormCurrentLocation;
        window.searchAddress = searchAddress;
        window.handleSearchKeyup = handleSearchKeyup;
        window.executeSearch = executeSearch;
        window.clearSearch = clearSearch;
        window.enableFallbackMap = enableFallbackMap;
        window.saveManualApiKey = saveManualApiKey;
        window.focusPlace = focusPlace;
        window.openConfirmModal = openConfirmModal;
        window.closeConfirmModal = closeConfirmModal;
    </script>
</body>
</html>

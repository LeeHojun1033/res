<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>맛집 저장소</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        * { -webkit-tap-highlight-color: transparent; }
        @supports (padding: env(safe-area-inset-bottom)) {
            .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* 모바일 바텀시트 전환 효과 */
        #sidebar-panel {
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: height;
        }
        @media (min-width: 768px) {
            #sidebar-panel { transition: none !important; height: 100% !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-[100dvh] flex flex-col overflow-hidden select-none">

    <header class="h-14 bg-slate-950 border-b border-slate-800 px-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-utensils text-amber-400 text-lg"></i>
            <h1 class="font-bold text-base md:text-lg text-slate-100 tracking-tight">맛집 저장소</h1>
        </div>
        <div class="flex items-center gap-2">
            <!-- 현위치 이동 버튼 -->
            <button onclick="panToCurrentLocation()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-xl border border-slate-700/80 transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-location-crosshairs text-amber-400"></i>
                <span class="hidden sm:inline">현위치</span>
            </button>
            <!-- 추천 버튼 -->
            <button onclick="recommendPlaces()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-lg shadow-rose-950 transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-thumbs-up"></i>
                <span>추천</span>
            </button>
            <!-- 신규 등록 버튼 -->
            <button onclick="openFormForAdd()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl font-semibold shadow-lg shadow-indigo-950 transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-plus"></i>
                <span>등록</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <div id="map-panel" class="flex-1 w-full md:flex-1 relative bg-slate-950">
            <div id="map"></div>
            
            <!-- 지도 안내 뱃지 -->
            <div class="absolute bottom-3 left-3 z-10 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-700/80 text-[11px] text-slate-300 pointer-events-none flex items-center gap-1.5 shadow-lg hidden sm:flex">
                <i class="fa-solid fa-circle-info text-amber-400"></i>
                <span>지도를 클릭하면 해당 위치 주소로 위치가 등록/수정됩니다.</span>
            </div>

            <!-- 카카오 지도 오류/미연동 시 안내 폴백 레이어 -->
            <div id="map-error-banner" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-20 flex flex-col items-center justify-center p-6 text-center">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-4xl mb-3"></i>
                <h3 class="font-bold text-slate-100 text-sm md:text-base mb-1">카카오맵 연동 안내</h3>
                <p class="text-xs text-slate-400 max-w-sm mb-4 leading-relaxed">
                    카카오 디벨로퍼스 콘솔의 <strong class="text-indigo-400">[내 애플리케이션 &gt; 플랫폼 &gt; Web]</strong>에 현재 접속 주소가 등록되어 있어야 지도가 정상적으로 표시됩니다.
                </p>
                <div class="flex gap-2">
                    <button onclick="retryKakaoMap()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-semibold transition">
                        다시 시도
                    </button>
                    <button onclick="useOpenStreetMapFallback()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-xl font-medium transition">
                        오픈 지도(OSM)로 표시
                    </button>
                </div>
            </div>
        </div>

        <div id="sidebar-panel" class="w-full h-[58%] md:h-full md:w-[400px] bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 flex flex-col z-10 shadow-2xl relative overflow-hidden shrink-0">
            
            <!-- 모바일 전체화면용 드래그 핸들 (모바일에서만 표시) -->
            <div id="drag-handle" class="md:hidden w-full h-6 flex items-center justify-center bg-slate-900 shrink-0 cursor-ns-resize" title="클릭하거나 드래그하여 화면 크기 조절">
                <div class="w-12 h-1.5 bg-slate-600 rounded-full"></div>
            </div>

            <!-- 상단 상태 안내 -->
            <div class="px-3.5 py-2 bg-slate-950/60 border-y border-slate-800/80 flex items-center justify-between text-xs font-medium shrink-0">
                <button id="sort-toggle-btn" onclick="toggleSortMode()" class="text-amber-400 flex items-center gap-1 hover:brightness-125 transition cursor-pointer active:scale-95">
                    <i id="sort-icon" class="fa-solid fa-arrow-down-wide-short"></i> 
                    <span id="sort-text">평점 순</span>
                </button>
                <span id="place-count-badge" class="text-slate-400 text-[11px]">총 0곳</span>
            </div>

            <!-- 카테고리 필터 바 -->
            <div class="p-2.5 border-b border-slate-800 bg-slate-950/40 flex gap-1.5 overflow-x-auto text-xs shrink-0 scrollbar-none">
                <button onclick="filterCategory('전체')" class="category-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm">전체</button>
                <button onclick="filterCategory('카페')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">카페</button>
                <button onclick="filterCategory('한식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">한식</button>
                <button onclick="filterCategory('양식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">양식</button>
                <button onclick="filterCategory('일식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">일식</button>
                <button onclick="filterCategory('중식')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">중식</button>
                <button onclick="filterCategory('기타')" class="category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition">기타</button>
            </div>

            <!-- 맛집 리스트 패널 -->
            <div id="place-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/60 bg-slate-900 safe-bottom">
                <!-- JS에서 동적 생성됨 -->
            </div>

            <!-- 맛집 등록/수정 폼 -->
            <div id="form-panel" class="hidden border-t border-slate-800 bg-slate-950/95 p-4 shrink-0 overflow-y-auto max-h-[70%] md:max-h-[85%] shadow-2xl z-20 absolute bottom-0 w-full">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="form-title" class="font-bold text-slate-100 text-xs md:text-sm flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-indigo-400"></i> 맛집 정보 수정
                    </h2>
                    <button type="button" onclick="closeForm()" class="text-slate-400 hover:text-slate-200 p-1 transition">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>

                <form id="place-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
                    <input type="hidden" id="place-id">

                    <div>
                        <label class="block font-medium text-slate-300 mb-1">상호명 (가게 이름) *</label>
                        <div class="flex gap-1.5 relative">
                            <input type="text" id="input-name" required placeholder="가게 이름을 입력하세요" class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                            <button type="button" onclick="searchAddress()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl font-medium transition whitespace-nowrap">상호 검색</button>
                        </div>
                        <ul id="name-search-results" class="hidden mt-1.5 bg-slate-800 border border-slate-700 rounded-xl max-h-48 overflow-y-auto shadow-xl text-xs divide-y divide-slate-700/50 absolute w-[calc(100%-2rem)] z-50"></ul>
                    </div>

                    <div>
                        <label class="block font-medium text-slate-300 mb-1">위치 정보 (주소) *</label>
                        <div class="flex gap-1.5">
                            <input type="text" id="input-address" required placeholder="직접 주소 입력 또는 지도 클릭" class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500">
                            <button type="button" onclick="searchSpecificAddress()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl font-medium transition whitespace-nowrap">주소 검색</button>
                        </div>
                        <input type="hidden" id="input-lat">
                        <input type="hidden" id="input-lng">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-medium text-slate-300 mb-1">카테고리 *</label>
                            <select id="input-category" required class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-2.5 py-2 focus:outline-none focus:border-indigo-500">
                                <option value="카페">카페</option>
                                <option value="한식">한식</option>
                                <option value="양식">양식</option>
                                <option value="일식">일식</option>
                                <option value="중식">중식</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-300 mb-1">평점 (0.5 단위) *</label>
                            <select id="input-rating" required class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-2.5 py-2 focus:outline-none focus:border-indigo-500">
                                <option value="5.0">⭐⭐⭐⭐⭐ (5.0)</option>
                                <option value="4.5">⭐⭐⭐⭐½ (4.5)</option>
                                <option value="4.0">⭐⭐⭐⭐ (4.0)</option>
                                <option value="3.5">⭐⭐⭐½ (3.5)</option>
                                <option value="3.0">⭐⭐⭐ (3.0)</option>
                                <option value="2.5">⭐⭐½ (2.5)</option>
                                <option value="2.0">⭐⭐ (2.0)</option>
                                <option value="1.5">⭐½ (1.5)</option>
                                <option value="1.0">⭐ (1.0)</option>
                                <option value="0.5">½ (0.5)</option>
                                <option value="0.0">📌 방문예정</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block font-medium text-slate-300 mb-1">메모 / 리뷰</label>
                        <textarea id="input-memo" rows="2" placeholder="추천 메뉴나 분위기 등을 작성하세요." class="w-full bg-slate-900 border border-slate-700 text-slate-100 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-indigo-950">저장하기</button>
                        <button type="button" onclick="closeForm()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2.5 rounded-xl transition">취소</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/95 text-slate-100 text-xs px-4 py-2.5 rounded-2xl border border-slate-700/80 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-indigo-400"></i>
        <span id="toast-msg">알림 메시지</span>
    </div>

    <!-- Firebase v10 Realtime DB & Kakao Map Engine Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyBmJF8oDIVUkrzXayIhrzBCQwSdmozXVWo",
            authDomain: "restaurant-8c4a3.firebaseapp.com",
            databaseURL: "https://restaurant-8c4a3-default-rtdb.firebaseio.com",
            projectId: "restaurant-8c4a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const placesRef = ref(db, 'restaurants');
        const KAKAO_KEY = "f88913c579f0bc23016de619484e0156";

        let map = null;
        let leafletMap = null;
        let infoWindow = null;
        let markers = [];
        let leafletMarkers = [];
        let placesData = [];
        let customOverlays = {}; // 카카오맵 오버레이 Z-index 관리를 위한 객체
        let maxZIndex = 10;      // 현재 최상단 Z-index 값
        let currentFilter = '전체';
        let currentSort = 'rating'; 
        let userLat = null;         
        let userLng = null;         
        let clickMarker = null;
        let isFallbackMode = false;
        let toastTimeout = null;

        let isRecommendationMode = false;
        let recommendedPlaceIds = [];
        let recommendationHistory = [];

        // XSS 방지
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 거리 계산 (Haversine)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function initMobileDragSheet() {
            const sidebarPanel = document.getElementById('sidebar-panel');
            const dragHandle = document.getElementById('drag-handle');
            if (!sidebarPanel || !dragHandle) return;

            let isDragging = false;
            let startY;
            let startHeight;

            const isMobile = () => window.innerWidth < 768;

            dragHandle.addEventListener('touchstart', (e) => {
                if (!isMobile()) return;
                isDragging = true;
                startY = e.touches[0].clientY;
                startHeight = sidebarPanel.offsetHeight;
                sidebarPanel.style.transition = 'none'; 
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging || !isMobile()) return;
                
                const deltaY = e.touches[0].clientY - startY;
                let newHeight = startHeight - deltaY;
                
                const maxHeight = window.innerHeight * 0.85; 
                const minHeight = 65; 
                
                if (newHeight > maxHeight) newHeight = maxHeight;
                if (newHeight < minHeight) newHeight = minHeight;
                
                sidebarPanel.style.height = `${newHeight}px`;
            }, { passive: true });

            document.addEventListener('touchend', () => {
                if (!isDragging || !isMobile()) return;
                isDragging = false;
                
                sidebarPanel.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                
                const currentHeight = sidebarPanel.offsetHeight;
                const screenHeight = window.innerHeight;
                
                if (currentHeight < screenHeight * 0.35) {
                    sidebarPanel.style.height = '65px'; 
                } else {
                    sidebarPanel.style.height = '58%'; 
                }
                
                setTimeout(() => { if (map) map.relayout(); }, 300);
            });

            dragHandle.addEventListener('click', () => {
                if (!isMobile()) return;
                
                if (sidebarPanel.offsetHeight < 100) {
                    sidebarPanel.style.height = '58%'; 
                } else {
                    sidebarPanel.style.height = '65px'; 
                }
                setTimeout(() => { if (map) map.relayout(); }, 300);
            });

            window.addEventListener('resize', () => {
                if (!isMobile()) {
                    sidebarPanel.style.height = '';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMobileDragSheet(); 
            initKakaoMapEngine();
            listenRealtimeData();
        });

        function listenRealtimeData() {
            onValue(placesRef, (snapshot) => {
                const data = snapshot.val();
                placesData = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        placesData.push({ id: key, ...data[key] });
                    });
                }
                renderUI();
            }, (error) => {
                console.error("Firebase Database 읽기 실패:", error);
                showToast("데이터를 불러오는데 실패했습니다.");
            });
        }

        function initKakaoMapEngine() {
            if (window.kakao && window.kakao.maps) {
                setupKakaoMap();
                return;
            }

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;

            script.onload = () => {
                try {
                    kakao.maps.load(() => setupKakaoMap());
                } catch (e) {
                    showMapErrorBanner();
                }
            };
            script.onerror = () => showMapErrorBanner();
            document.head.appendChild(script);
        }

        function setupKakaoMap() {
            const container = document.getElementById('map');
            if (!container) return;

            const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 4 };
            map = new kakao.maps.Map(container, options);
            infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            setTimeout(() => {
                if (map) {
                    map.relayout();
                    map.setCenter(new kakao.maps.LatLng(37.5665, 126.9780));
                }
            }, 300);

            kakao.maps.event.addListener(map, 'click', (mouseEvent) => {
                const lat = mouseEvent.latLng.getLat();
                const lng = mouseEvent.latLng.getLng();

                if (clickMarker) clickMarker.setMap(null);
                clickMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(lat, lng),
                    map: map
                });

                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.coord2Address(lng, lat, (result, status) => {
                    let addressName = '선택 위치 주소';
                    if (status === kakao.maps.services.Status.OK && result[0]) {
                        addressName = result[0].road_address 
                            ? result[0].road_address.address_name 
                            : result[0].address.address_name;
                    }
                    
                    const isEditing = !!document.getElementById('place-id').value;
                    if (isEditing) {
                        updateFormLocation(lat, lng, addressName);
                        showToast('📍 클릭한 위치로 변경되었습니다.');
                    } else {
                        openFormForAdd(lat, lng, addressName);
                    }
                });
            });

            window.addEventListener('resize', () => { if (map) map.relayout(); });
            panToCurrentLocation();
            renderUI();
        }

        function showMapErrorBanner() {
            const banner = document.getElementById('map-error-banner');
            if (banner) banner.classList.remove('hidden');
        }

        function retryKakaoMap() {
            const banner = document.getElementById('map-error-banner');
            if (banner) banner.classList.add('hidden');
            initKakaoMapEngine();
        }

        function useOpenStreetMapFallback() {
            if (isFallbackMode) return;
            isFallbackMode = true;

            const banner = document.getElementById('map-error-banner');
            if (banner) banner.classList.add('hidden');

            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            document.head.appendChild(css);

            const js = document.createElement('script');
            js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            js.onload = () => {
                const container = document.getElementById('map');
                container.innerHTML = '';
                
                leafletMap = L.map('map').setView([37.5665, 126.9780], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(leafletMap);

                leafletMap.on('click', (e) => {
                    const lat = e.latlng.lat;
                    const lng = e.latlng.lng;
                    const addressName = `선택 좌표 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                    const isEditing = !!document.getElementById('place-id').value;
                    if (isEditing) {
                        updateFormLocation(lat, lng, addressName);
                        showToast('📍 클릭한 위치로 변경되었습니다.');
                    } else {
                        openFormForAdd(lat, lng, addressName);
                    }
                });

                panToCurrentLocation();
                renderUI();
            };
            document.head.appendChild(js);
        }

        function renderUI() {
            let filtered = [];
            
            if (isRecommendationMode) {
                filtered = placesData.filter(p => recommendedPlaceIds.includes(p.id));
                filtered.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
            } else {
                filtered = currentFilter === '전체' 
                    ? [...placesData] 
                    : placesData.filter(p => p.category === currentFilter);

                if (currentSort === 'rating') {
                    filtered.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                } else if (currentSort === 'distance' && userLat && userLng) {
                    filtered.forEach(p => {
                        p.distance = getDistanceFromLatLonInKm(userLat, userLng, parseFloat(p.latitude), parseFloat(p.longitude));
                    });
                    filtered.sort((a, b) => a.distance - b.distance);
                }
            }

            document.getElementById('place-count-badge').innerText = `총 ${filtered.length}곳`;

            if (markers) markers.forEach(m => { if (m.setMap) m.setMap(null); });
            markers = [];
            customOverlays = {};

            if (leafletMarkers && leafletMap) leafletMarkers.forEach(m => leafletMap.removeLayer(m));
            leafletMarkers = [];

            const listContainer = document.getElementById('place-list');
            listContainer.innerHTML = '';
            
            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-8 text-center text-slate-500 text-xs">
                        <i class="fa-solid fa-utensils text-2xl mb-2 text-slate-600 block"></i>
                        <p>등록된 맛집이 없습니다.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((place, index) => {
                const lat = parseFloat(place.latitude) || 37.5665;
                const lng = parseFloat(place.longitude) || 126.9780;
                const ratingDisplay = parseFloat(place.rating) === 0 
                    ? '<span class="text-rose-400 font-bold">📌 방문예정</span>' 
                    : `<span class="text-amber-400 font-bold">⭐ ${parseFloat(place.rating).toFixed(1)}</span>`;

                let distanceDisplay = '';
                if (currentSort === 'distance' && place.distance !== undefined) {
                    const distStr = place.distance < 1 
                        ? `${(place.distance * 1000).toFixed(0)}m` 
                        : `${place.distance.toFixed(1)}km`;
                    distanceDisplay = `<span class="text-emerald-400 font-bold text-[10px] ml-1 bg-emerald-950/50 px-1.5 py-0.5 rounded border border-emerald-800/80"><i class="fa-solid fa-location-arrow mr-0.5"></i>${distStr}</span>`;
                }

                const naverMapUrl = `https://map.naver.com/index.nhn?slng=&slat=&stext=&elng=${lng}&elat=${lat}&etext=${encodeURIComponent(place.name)}&menu=route`;

                if (!isFallbackMode && map && typeof kakao !== 'undefined' && kakao.maps) {
                    const markerPosition = new kakao.maps.LatLng(lat, lng);
                    const marker = new kakao.maps.Marker({ position: markerPosition, map: map });

                    // text-left를 text-justify로 수정 (양쪽 정렬)
                    const overlayContent = `
                        <div onmousedown="bringToFront('${place.id}')" ontouchstart="bringToFront('${place.id}')" class="bg-slate-900/95 backdrop-blur-md border border-slate-700/80 shadow-2xl rounded-xl p-2.5 flex flex-col items-center justify-center min-w-[140px] max-w-[200px] z-30 transition-transform active:scale-[0.98]">
                            <div class="cursor-pointer flex flex-col items-center w-full group" onclick="toggleOverlayMemo('${place.id}')" title="클릭하여 메모 보기">
                                <span class="text-slate-100 font-bold text-[12px] whitespace-nowrap leading-tight mb-1.5 group-hover:text-indigo-400 transition-colors">${escapeHtml(place.name)}</span>
                                <div class="flex items-center gap-1.5 mb-1.5">
                                    <span class="text-[10px] whitespace-nowrap">${ratingDisplay}</span>
                                    <i class="fa-solid fa-chevron-down text-[9px] text-slate-500 group-hover:text-indigo-400 transition-colors"></i>
                                </div>
                            </div>
                            
                            <div id="overlay-memo-${place.id}" class="hidden w-full text-[11px] text-slate-300 border-t border-slate-700/80 pt-2.5 pb-2 mb-2 whitespace-pre-wrap break-words text-justify leading-relaxed">
                                ${place.memo ? escapeHtml(place.memo) : '<span class="text-slate-500 italic text-center block">작성된 메모가 없습니다.</span>'}
                            </div>

                            <div class="flex justify-center w-full">
                                <a href="${naverMapUrl}" target="_blank" rel="noopener noreferrer" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded shadow-sm transition flex items-center justify-center gap-1 w-full" title="네이버지도 길찾기">
                                    <i class="fa-solid fa-diamond-turn-right"></i> 길찾기
                                </a>
                            </div>
                        </div>
                    `;

                    const customOverlay = new kakao.maps.CustomOverlay({
                        position: markerPosition,
                        content: overlayContent,
                        map: map,
                        yAnchor: 2.2,
                        clickable: true,
                        zIndex: 10
                    });

                    customOverlays[place.id] = customOverlay;
                    markers.push(marker);
                    markers.push(customOverlay);
                    
                } else if (leafletMap) {
                    // 텍스트 정렬을 justify(양쪽 정렬)로 수정
                    const lMarker = L.marker([lat, lng]).addTo(leafletMap)
                        .bindPopup(`
                            <div style="text-align:center; font-size: 12px; min-width: 120px;">
                                <div style="cursor:pointer; margin-bottom: 6px;" onclick="document.getElementById('leaflet-memo-${place.id}').style.display = document.getElementById('leaflet-memo-${place.id}').style.display === 'none' ? 'block' : 'none'" title="클릭하여 메모 보기">
                                    <b>${escapeHtml(place.name)}</b><br>${ratingDisplay}
                                    <div style="font-size:9px; color:#888; margin-top:4px;">▼ 메모 보기</div>
                                </div>
                                <div id="leaflet-memo-${place.id}" style="display:none; margin-top:8px; padding-top:8px; border-top:1px solid #ccc; font-size:11px; text-align:justify; white-space:pre-wrap; word-break:break-word; line-height: 1.4;">
                                    ${place.memo ? escapeHtml(place.memo) : '<div style="text-align:center; color:#888; font-style:italic;">작성된 메모가 없습니다.</div>'}
                                </div>
                                <a href="${naverMapUrl}" target="_blank" style="display:block; margin-top:8px; background:#059669; color:white; padding:6px 8px; border-radius:4px; text-decoration:none; font-size:11px; font-weight:bold;">📍 길찾기</a>
                            </div>
                        `);
                    leafletMarkers.push(lMarker);
                }

                const itemEl = document.createElement('div');
                itemEl.className = 'p-3 hover:bg-slate-800/80 transition cursor-pointer flex justify-between items-start group';
                itemEl.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2" onclick="focusPlace(${lat}, ${lng}, '${escapeHtml(place.name)}')">
                        <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                            <span class="text-[10px] font-bold bg-indigo-950 text-indigo-400 border border-indigo-800/80 px-2 py-0.5 rounded-md">TOP ${index + 1}</span>
                            <span class="font-bold text-slate-100 text-sm group-hover:text-indigo-400 transition truncate">${escapeHtml(place.name)}</span>
                            <span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-300 rounded-md border border-slate-700/60 font-medium">${escapeHtml(place.category)}</span>
                        </div>
                        <p class="text-xs text-slate-400 mb-1 line-clamp-1"><i class="fa-solid fa-location-dot text-[10px] text-slate-500 mr-1"></i>${escapeHtml(place.address)}</p>
                        <div class="flex items-center gap-1.5 text-xs">
                            ${ratingDisplay}
                            ${distanceDisplay}
                            ${place.memo ? `<span class="text-slate-500 text-[11px] truncate max-w-[150px] ml-1 border-l border-slate-700 pl-2">${escapeHtml(place.memo)}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-1 opacity-90 group-hover:opacity-100 transition items-center">
                        <a href="${naverMapUrl}" target="_blank" rel="noopener noreferrer" class="p-1.5 text-slate-400 hover:text-emerald-400 text-xs rounded-lg hover:bg-slate-800" title="네이버지도 길찾기">
                            <i class="fa-solid fa-diamond-turn-right text-sm"></i>
                        </a>
                        <button onclick="openFormForEdit('${place.id}')" class="p-1.5 text-slate-400 hover:text-indigo-400 text-xs rounded-lg hover:bg-slate-800" title="수정">
                            <i class="fa-solid fa-pen-to-square text-sm"></i>
                        </button>
                        <button onclick="deletePlace('${place.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 text-xs rounded-lg hover:bg-slate-800" title="삭제">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        function toggleOverlayMemo(id) {
            bringToFront(id); // 메모를 열 때도 최상단으로 올리기
            const memoEl = document.getElementById(`overlay-memo-${id}`);
            if (memoEl) memoEl.classList.toggle('hidden');
        }

        // 특정 오버레이를 화면 최상단으로 올리는 함수
        function bringToFront(id) {
            if (customOverlays[id]) {
                maxZIndex++;
                customOverlays[id].setZIndex(maxZIndex);
            }
        }

        function toggleSortMode() {
            if (currentSort === 'rating') {
                let centerLat = null;
                let centerLng = null;

                if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                    const center = map.getCenter();
                    centerLat = center.getLat();
                    centerLng = center.getLng();
                } else if (leafletMap) {
                    const center = leafletMap.getCenter();
                    centerLat = center.lat;
                    centerLng = center.lng;
                }

                if (centerLat !== null && centerLng !== null) {
                    userLat = centerLat;
                    userLng = centerLng;
                    currentSort = 'distance';
                    
                    document.getElementById('sort-icon').className = 'fa-solid fa-location-arrow';
                    document.getElementById('sort-text').innerText = '거리 순';
                    document.getElementById('sort-toggle-btn').className = 'text-emerald-400 flex items-center gap-1 hover:brightness-125 transition cursor-pointer active:scale-95';
                    
                    renderUI();
                    showToast('지도 중앙을 기준으로 정렬되었습니다.');
                } else {
                    showToast('지도 정보를 불러올 수 없습니다.');
                }
            } else {
                currentSort = 'rating';
                document.getElementById('sort-icon').className = 'fa-solid fa-arrow-down-wide-short';
                document.getElementById('sort-text').innerText = '평점 순';
                document.getElementById('sort-toggle-btn').className = 'text-amber-400 flex items-center gap-1 hover:brightness-125 transition cursor-pointer active:scale-95';
                renderUI();
                showToast('평점 순으로 정렬되었습니다.');
            }
        }

        function filterCategory(cat) {
            isRecommendationMode = false; 
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = 'category-btn active bg-indigo-600 text-white px-3 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm';
                } else {
                    btn.className = 'category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition';
                }
            });

            renderUI();

            if (cat === '전체' && map && placesData.length > 0 && typeof kakao !== 'undefined' && kakao.maps) {
                const bounds = new kakao.maps.LatLngBounds();
                placesData.forEach(p => bounds.extend(new kakao.maps.LatLng(p.latitude, p.longitude)));
                map.setBounds(bounds);
            }
        }

        function panToCurrentLocation() {
            if (navigator.geolocation) {
                // 권한 상태 확인 API를 사용하여 "이미 허용된" 경우에만 위치 로드 최적화
                if (navigator.permissions) {
                    navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                        if (result.state === 'denied') {
                            showToast('위치 권한이 차단되어 있습니다. 브라우저 설정에서 권한을 허용해주세요.');
                            return;
                        }
                        
                        // granted(허용됨) 이거나 prompt(물어봐야함) 인 경우 위치 가져오기 시도
                        executeGeolocation();
                        
                        // 권한 상태 변경 감지
                        result.onchange = function() {
                            if (result.state === 'granted') {
                                executeGeolocation();
                            }
                        }
                    });
                } else {
                     // permissions API 미지원 브라우저의 경우 바로 시도
                     executeGeolocation();
                }
            } else {
                showToast('현재 브라우저에서는 위치 기능을 지원하지 않습니다.');
            }
        }

        // 실제 위치를 가져오는 내부 함수
        function executeGeolocation() {
             navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                        map.panTo(new kakao.maps.LatLng(lat, lng));
                    } else if (leafletMap) {
                        leafletMap.setView([lat, lng], 15);
                    }
                    showToast('현재 위치로 이동했습니다.');
                }, (error) => {
                    console.warn("Geolocation denied or failed:", error);
                    if(error.code === 1) { // PERMISSION_DENIED
                        showToast('위치 권한이 거부되었습니다. 브라우저 주소창 왼쪽 자물쇠를 눌러 권한을 재설정해주세요.');
                    } else {
                        showToast('위치를 가져올 수 없습니다. GPS 연결 상태를 확인해주세요.');
                    }
                }, {
                    enableHighAccuracy: true, // 높은 정확도 요구
                    timeout: 5000,           // 5초 타임아웃
                    maximumAge: 0            // 캐시된 위치 사용 안함
                });
        }

        function focusPlace(lat, lng, name) {
            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                map.panTo(new kakao.maps.LatLng(lat, lng));
            } else if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
            }
        }

        function updateFormLocation(lat, lng, address) {
            document.getElementById('input-lat').value = lat;
            document.getElementById('input-lng').value = lng;
            document.getElementById('input-address').value = address;
        }

        function selectSearchResult(lat, lng, name, address) {
            lat = parseFloat(lat);
            lng = parseFloat(lng);
            document.getElementById('input-name').value = name;
            updateFormLocation(lat, lng, address);
            document.getElementById('name-search-results').classList.add('hidden');

            if (map && !isFallbackMode) {
                map.panTo(new kakao.maps.LatLng(lat, lng));
                if (clickMarker) clickMarker.setMap(null);
                clickMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map });
            } else if (leafletMap) {
                leafletMap.setView([lat, lng], 16);
            }
            showToast(`'${name}' 장소가 선택되었습니다.`);
        }

        function searchAddress() {
            const keyword = document.getElementById('input-name').value.trim();
            const resultsContainer = document.getElementById('name-search-results');
            resultsContainer.innerHTML = '';
            
            if (!keyword) {
                showToast('상호명을 입력해 주세요.');
                resultsContainer.classList.add('hidden');
                return;
            }

            if (!isFallbackMode && typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                const ps = new kakao.maps.services.Places();
                const options = map ? { location: map.getCenter(), sort: kakao.maps.services.SortBy.DISTANCE } : {};

                ps.keywordSearch(keyword, (data, status) => {
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        resultsContainer.classList.remove('hidden');
                        data.forEach((place) => {
                            const lat = parseFloat(place.y);
                            const lng = parseFloat(place.x);
                            const address = place.road_address_name || place.address_name;
                            
                            const li = document.createElement('li');
                            li.className = 'p-2.5 hover:bg-slate-700 cursor-pointer transition';
                            li.innerHTML = `
                                <div class="font-bold text-slate-100 flex items-center justify-between">
                                    <span>${escapeHtml(place.place_name)}</span>
                                    ${place.category_name ? `<span class="text-[9px] text-indigo-400 font-normal bg-indigo-950/50 px-1.5 py-0.5 rounded">${escapeHtml(place.category_name.split(' > ').pop())}</span>` : ''}
                                </div>
                                <div class="text-[10px] text-slate-400 mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(address)}</div>
                            `;
                            li.onclick = () => selectSearchResult(lat, lng, place.place_name, address);
                            resultsContainer.appendChild(li);
                        });
                        showToast(`검색된 장소를 선택해 주세요.`);
                    } else {
                        resultsContainer.classList.add('hidden');
                        showToast('상호명 검색 결과를 찾을 수 없습니다.');
                    }
                }, options);
            }
        }

        function searchSpecificAddress() {
            const address = document.getElementById('input-address').value.trim();
            if (!address) {
                showToast('검색할 주소를 입력해 주세요.');
                return;
            }

            if (!isFallbackMode && typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.addressSearch(address, (data, status) => {
                    if (status === kakao.maps.services.Status.OK && data.length > 0) {
                        const place = data[0];
                        const lat = parseFloat(place.y);
                        const lng = parseFloat(place.x);
                        const addressName = place.road_address ? place.road_address.address_name : place.address.address_name;

                        updateFormLocation(lat, lng, addressName);
                        if (map) {
                            map.panTo(new kakao.maps.LatLng(lat, lng));
                            if (clickMarker) clickMarker.setMap(null);
                            clickMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map });
                        }
                        showToast('입력하신 주소 위치를 확인했습니다.');
                    }
                });
            }
        }

        function openFormForAdd(lat = '', lng = '', address = '') {
            const formPanel = document.getElementById('form-panel');
            formPanel.classList.remove('hidden');
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-400"></i> 맛집 등록`;
            document.getElementById('place-id').value = '';
            document.getElementById('place-form').reset();
            if (lat && lng) updateFormLocation(lat, lng, address);
        }

        function openFormForEdit(id) {
            const place = placesData.find(p => p.id === id);
            if (!place) return;

            const formPanel = document.getElementById('form-panel');
            formPanel.classList.remove('hidden');
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-400"></i> 맛집 정보 수정`;
            
            document.getElementById('place-id').value = place.id;
            document.getElementById('input-name').value = place.name;
            document.getElementById('input-address').value = place.address;
            document.getElementById('input-lat').value = place.latitude;
            document.getElementById('input-lng').value = place.longitude;
            document.getElementById('input-category').value = place.category;
            document.getElementById('input-rating').value = parseFloat(place.rating).toFixed(1);
            document.getElementById('input-memo').value = place.memo || '';

            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                map.panTo(new kakao.maps.LatLng(place.latitude, place.longitude));
            }
        }

        function closeForm() {
            document.getElementById('form-panel').classList.add('hidden');
            document.getElementById('name-search-results').classList.add('hidden');
            if (clickMarker && clickMarker.setMap) clickMarker.setMap(null);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('place-id').value;
            const name = document.getElementById('input-name').value.trim();
            const address = document.getElementById('input-address').value.trim();
            const lat = document.getElementById('input-lat').value;
            const lng = document.getElementById('input-lng').value;
            const category = document.getElementById('input-category').value;
            const rating = parseFloat(document.getElementById('input-rating').value);
            const memo = document.getElementById('input-memo').value.trim();

            if (!name || !address) {
                showToast('상호명과 주소를 모두 입력해주세요.');
                return;
            }

            const payload = {
                name, address, category, rating, memo,
                latitude: lat ? parseFloat(lat) : 37.5665,
                longitude: lng ? parseFloat(lng) : 126.9780,
                updatedAt: Date.now()
            };

            if (id) {
                update(ref(db, `restaurants/${id}`), payload).then(() => {
                    showToast(`'${name}' 정보가 수정되었습니다.`);
                    closeForm();
                });
            } else {
                push(placesRef, payload).then(() => {
                    showToast(`'${name}' 신규 등록되었습니다.`);
                    closeForm();
                });
            }
        }

        function deletePlace(id) {
            const place = placesData.find(p => p.id === id);
            remove(ref(db, `restaurants/${id}`)).then(() => {
                showToast(`'${place ? place.name : '항목'}'이 삭제되었습니다.`);
            });
        }

        function recommendPlaces() {
            let centerLat = null;
            let centerLng = null;

            if (!isFallbackMode && map && typeof kakao !== 'undefined') {
                const center = map.getCenter();
                centerLat = center.getLat();
                centerLng = center.getLng();
            } else if (leafletMap) {
                const center = leafletMap.getCenter();
                centerLat = center.lat;
                centerLng = center.lng;
            }

            if (centerLat === null || centerLng === null) {
                showToast('지도 위치를 확인할 수 없습니다.');
                return;
            }

            let allCandidates = placesData.filter(p => {
                if (p.category === '카페') return false;
                const dist = getDistanceFromLatLonInKm(centerLat, centerLng, parseFloat(p.latitude), parseFloat(p.longitude));
                return dist <= 10;
            });

            if (allCandidates.length === 0) {
                showToast('반경 10km 이내에 추천할 식당이 없습니다.');
                return;
            }

            let candidates = allCandidates.filter(p => !recommendationHistory.includes(p.id));

            if (candidates.length === 0) {
                recommendationHistory = [];
                candidates = [...allCandidates];
                showToast('주변 맛집을 모두 확인하셨습니다! 다시 새롭게 추천합니다.');
            } else {
                showToast('주변 10km 이내 새로운 맛집을 추천합니다! 👍');
            }

            candidates.sort(() => Math.random() - 0.5);
            const top3 = candidates.slice(0, 3);
            
            recommendationHistory.push(...top3.map(p => p.id));
            isRecommendationMode = true;
            recommendedPlaceIds = top3.map(p => p.id);

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = 'category-btn bg-slate-800 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full font-medium whitespace-nowrap hover:bg-slate-700 transition';
            });

            renderUI();

            if (!isFallbackMode && map && typeof kakao !== 'undefined' && kakao.maps) {
                const bounds = new kakao.maps.LatLngBounds();
                top3.forEach(p => bounds.extend(new kakao.maps.LatLng(parseFloat(p.latitude), parseFloat(p.longitude))));
                map.setBounds(bounds);
            }
        }

        Object.assign(window, {
            panToCurrentLocation, toggleSortMode, filterCategory,
            openFormForAdd, openFormForEdit, closeForm,
            handleFormSubmit, deletePlace, searchAddress, searchSpecificAddress,
            retryKakaoMap, useOpenStreetMapFallback, focusPlace, recommendPlaces,
            toggleOverlayMemo, bringToFront
        });
    </script>
</body>
</html>
